# Mitra finetune config — only the differences from the config.py defaults
# (mix_scm prior, 200 steps, AdamW). device auto-detects. Trains one decoder per
# capture depth for Tab2D; --model mitra downloads the checkpoint from HF.
out_dir: weights/mitra
# Mitra's 2D (row x feature) attention is memory-heavy — a small micro-batch keeps
# the forward under a 24GB card; fewer prior workers leave VRAM for it.
micro_batch_size: 8
prior:
  n_jobs: 4
  max_seq_len: 512  # shorter prior tables — the forward scales with seq length
